name: Release Ship

on:
  workflow_call:
    inputs:
      version:
        description: Release version
        required: true
        type: string

permissions:
  contents: write
  packages: write

jobs:
  docker:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Pin the release tag to the tested commit
        env:
          TAG: v${{ inputs.version }}
        run: |
          set -euo pipefail
          ref="refs/tags/$TAG"
          if git ls-remote --exit-code --refs origin "$ref" >/dev/null; then
            git fetch --no-tags origin "$ref"
            if [[ $(git rev-parse 'FETCH_HEAD^{commit}') != $(git rev-parse HEAD) ]]; then
              echo "::error::$TAG points to a different commit."
              exit 1
            fi
          else
            rc=$?
            [[ $rc == 2 ]] || exit "$rc"
            git push origin "HEAD:$ref"
          fi

      - name: Download Docker slices
        uses: actions/download-artifact@v4
        with:
          pattern: docker-slice-*
          path: slices
          merge-multiple: true

      - name: Assemble docker context
        run: |
          set -euo pipefail
          rm -rf docker_context
          mkdir -p docker_context
          cp -a slices/* docker_context/
          find docker_context -type f -exec ls -lh {} \;

      - name: Setup QEMU
        uses: docker/setup-qemu-action@v3

      - name: Setup Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Image names & tags
        id: img
        run: |
          set -euo pipefail
          OWNER="$(echo '${{ github.repository_owner }}' | tr '[:upper:]' '[:lower:]')"
          VERSION="${{ inputs.version }}"
          SERVER="ghcr.io/${OWNER}/astrave-server"
          CLIENT="ghcr.io/${OWNER}/astrave"
          {
            echo "server_tags<<EOF"
            echo "${SERVER}:${VERSION}"
            if [[ "$VERSION" != *-* ]]; then
              echo "${SERVER}:latest"
            fi
            echo "EOF"
            echo "client_tags<<EOF"
            echo "${CLIENT}:${VERSION}"
            if [[ "$VERSION" != *-* ]]; then
              echo "${CLIENT}:latest"
            fi
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Build & push astrave-server
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/Dockerfile.server
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.img.outputs.server_tags }}
          labels: |
            org.opencontainers.image.title=astrave-server
            org.opencontainers.image.description=Astrave server (intranet penetration / reverse tunnel)
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.version=${{ inputs.version }}

      - name: Build & push astrave
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/Dockerfile.client
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.img.outputs.client_tags }}
          labels: |
            org.opencontainers.image.title=astrave
            org.opencontainers.image.description=Astrave client (intranet penetration / reverse tunnel)
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.version=${{ inputs.version }}

      - name: Verify published image architectures
        env:
          VERSION: ${{ inputs.version }}
        run: |
          for image in astrave astrave-server; do
            ref="ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/$image:$VERSION"
            docker buildx imagetools inspect --raw "$ref" | jq -e '
              [.manifests[].platform | select(.os == "linux") | .architecture] | sort == ["amd64", "arm64"]'
          done

  publish:
    needs: docker
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Download CLI artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          pattern: cli-*
          merge-multiple: true

      - name: Download desktop artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          pattern: desktop-*
          merge-multiple: true

      - name: Download signed Android packages
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          name: android-apks

      - name: Verify the release asset list
        env:
          VERSION: ${{ inputs.version }}
        run: |
          cd artifacts
          {
            for name in astrave astrave-server; do
              for arch in amd64 arm64; do
                for platform in windows darwin; do echo "${name}_${VERSION}_${platform}_${arch}.tar.gz"; done
                for libc in gnu musl; do echo "${name}_${VERSION}_linux_${arch}_${libc}.tar.gz"; done
              done
              echo "${name}_${VERSION}_freebsd_amd64.tar.gz"
            done
            for arch in amd64 arm64; do
              echo "astrave-desktop_${VERSION}_darwin_${arch}.dmg"
              echo "astrave-desktop_${VERSION}_windows_${arch}.zip"
              echo "astrave-desktop_${VERSION}_linux_${arch}.deb"
            done
            for abi in arm64-v8a armeabi-v7a x86_64; do echo "astrave_${VERSION}_android_${abi}.apk"; done
          } | sort > "$RUNNER_TEMP/expected-assets"
          find . -type f -size +0c -printf '%P\n' | sort | diff -u "$RUNNER_TEMP/expected-assets" -

      - name: Create / update GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ inputs.version }}
          name: v${{ inputs.version }}
          draft: false
          prerelease: ${{ contains(inputs.version, '-') }}
          generate_release_notes: true
          fail_on_unmatched_files: true
          files: |
            artifacts/*.apk
            artifacts/*.tar.gz
            artifacts/*.dmg
            artifacts/*.zip
            artifacts/*.deb
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Verify published release assets against the staged packages
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: v${{ inputs.version }}
        run: |
          set -euo pipefail
          cd artifacts
          sha256sum * | LC_ALL=C sort > "$RUNNER_TEMP/local-assets.sha256"
          gh api "repos/$GITHUB_REPOSITORY/releases/tags/$TAG" \
            --jq '.assets[] | select(.state == "uploaded") | [(.digest | ltrimstr("sha256:")), .name] | join("  ")' \
            | LC_ALL=C sort | diff -u "$RUNNER_TEMP/local-assets.sha256" -
