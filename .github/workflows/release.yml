name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  meta:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.ver.outputs.version }}
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Resolve version
        id: ver
        run: |
          set -euo pipefail
          CARGO_V=$(python -c 'import tomllib; print(tomllib.load(open("rust/Cargo.toml", "rb"))["package"]["version"])')
          V="$CARGO_V"
          if [[ "$GITHUB_REF_TYPE" == tag ]]; then
            [[ "$GITHUB_REF_NAME" == v* ]]
            V="${GITHUB_REF_NAME#v}"
          fi
          APP_V=$(sed -nE 's/^version:[[:space:]]*([^[:space:]#]+).*/\1/p' app/pubspec.yaml)
          if [[ "$CARGO_V" != "$V" || "${APP_V%%+*}" != "$V" || ( "$APP_V" == *+* && ! "${APP_V#*+}" =~ ^[0-9]+$ ) ]]; then
            echo "Version mismatch between $GITHUB_REF_NAME, Cargo $CARGO_V and Flutter $APP_V" >&2
            exit 1
          fi
          echo "version=$V" >> "$GITHUB_OUTPUT"

  verify:
    if: github.ref_type == 'tag'
    needs: meta
    uses: ./.github/workflows/ci.yml
    with:
      release_version: ${{ needs.meta.outputs.version }}
    secrets: inherit

  binaries:
    needs: meta
    uses: ./.github/workflows/release-binaries.yml
    with:
      version: ${{ needs.meta.outputs.version }}

  desktop:
    needs: meta
    uses: ./.github/workflows/release-desktop.yml
    with:
      version: ${{ needs.meta.outputs.version }}

  ship:
    if: github.ref_type == 'tag'
    needs: [meta, verify, binaries, desktop]
    permissions:
      contents: write
      packages: write
    uses: ./.github/workflows/release-ship.yml
    with:
      version: ${{ needs.meta.outputs.version }}
