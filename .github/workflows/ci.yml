name: CI

on:
  workflow_dispatch:
  push:
    branches: [main, master]
  pull_request:
  workflow_call:
    inputs:
      release_version:
        type: string
        default: ''

env:
  CARGO_TERM_COLOR: always
  RUST_VERSION: "1.95.0"

jobs:
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ env.RUST_VERSION }}
          targets: aarch64-linux-android,armv7-linux-androideabi,x86_64-linux-android
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - name: Install Android SDK packages
        run: |
          JAVA_HOME="$JAVA_HOME_21_X64" "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" \
            'platform-tools' 'platforms;android-36' 'ndk;28.2.13676358'
          echo "$ANDROID_HOME/platform-tools" >> "$GITHUB_PATH"
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.9'
          cache: true
      - name: Prepare hardware-accelerated Android emulator
        if: github.event_name == 'workflow_dispatch' || github.ref == 'refs/heads/main'
        run: |
          sudo chmod a+rw /dev/kvm
          export ANDROID_USER_HOME="$RUNNER_TEMP/android-settings"
          export ANDROID_AVD_HOME="$ANDROID_USER_HOME/avd"
          mkdir -p "$ANDROID_AVD_HOME"
          image='system-images;android-33;default;x86_64'
          JAVA_HOME="$JAVA_HOME_21_X64" "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" emulator "$image"
          echo no | JAVA_HOME="$JAVA_HOME_21_X64" "$ANDROID_HOME/cmdline-tools/latest/bin/avdmanager" create avd -n settings -k "$image" -d pixel_2 -p "$ANDROID_AVD_HOME/settings.avd"
          test -s "$ANDROID_AVD_HOME/settings.avd/config.ini"
          "$ANDROID_HOME/emulator/emulator" -list-avds | grep -Fx settings
          echo "ANDROID_AVD_HOME=$ANDROID_AVD_HOME" >> "$GITHUB_ENV"
      - name: Prepare Android release signing
        if: inputs.release_version != ''
        env:
          KEYSTORE: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.ANDROID_STORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          : "${KEYSTORE:?Missing ANDROID_KEYSTORE_BASE64}" "${STORE_PASSWORD:?Missing ANDROID_STORE_PASSWORD}" "${KEY_ALIAS:?Missing ANDROID_KEY_ALIAS}" "${KEY_PASSWORD:?Missing ANDROID_KEY_PASSWORD}"
          umask 077
          printf '%s' "$KEYSTORE" | base64 --decode > "$RUNNER_TEMP/astrave.jks"
          echo "ASTRAVE_KEYSTORE=$RUNNER_TEMP/astrave.jks" >> "$GITHUB_ENV"
      - name: Build Android APKs
        working-directory: app
        env:
          ASTRAVE_STORE_PASSWORD: ${{ inputs.release_version != '' && secrets.ANDROID_STORE_PASSWORD || '' }}
          ASTRAVE_KEY_ALIAS: ${{ inputs.release_version != '' && secrets.ANDROID_KEY_ALIAS || '' }}
          ASTRAVE_KEY_PASSWORD: ${{ inputs.release_version != '' && secrets.ANDROID_KEY_PASSWORD || '' }}
        run: |
          flutter pub get --enforce-lockfile
          ANDROID_NDK_HOME="$ANDROID_HOME/ndk/28.2.13676358" flutter build apk --release --split-per-abi --no-pub
      - name: Verify APK signatures and stage release assets
        env:
          VERSION: ${{ inputs.release_version }}
        run: |
          set -euo pipefail
          signer=$(find "$ANDROID_HOME/build-tools" -type f -name apksigner | sort -V | tail -1)
          expected=''
          if [[ -n "$VERSION" ]]; then
            mkdir -p dist/android
            expected='ff58643e4fe7e9e1fdd86b6b0c53cfb535e8dc48771dfb49f119f3cde8ee9fbc'
          fi
          for abi in arm64-v8a armeabi-v7a x86_64; do
            apk="app/build/app/outputs/flutter-apk/app-$abi-release.apk"
            "$signer" verify --print-certs "$apk" > "$RUNNER_TEMP/apk-signer.txt"
            digest=$(awk '/ certificate SHA-256 digest: / {print $NF}' "$RUNNER_TEMP/apk-signer.txt" | sort -u)
            if [[ ! "$digest" =~ ^[0-9a-f]{64}$ || "$digest" != "${expected:-$digest}" ]]; then
              echo "::error::Unexpected APK signing certificate for $abi (expected $expected, found $digest)"
              exit 1
            fi
            expected=$digest
            echo "$abi signing certificate SHA-256 $digest"
            if [[ -n "$VERSION" ]]; then cp "$apk" "dist/android/astrave_${VERSION}_android_$abi.apk"; fi
          done
      - uses: actions/upload-artifact@v4
        if: inputs.release_version != ''
        with:
          name: android-apks
          path: dist/android/*.apk
          if-no-files-found: error

      - name: Exercise settings and capture device screenshots
        if: github.event_name == 'workflow_dispatch' || github.ref == 'refs/heads/main'
        timeout-minutes: 15
        run: |
          adb start-server
          "$ANDROID_HOME/emulator/emulator" -avd settings -no-window -no-snapshot -no-audio -no-boot-anim -gpu swiftshader -memory 2048 > "$RUNNER_TEMP/emulator.log" 2>&1 &
          emulator_pid=$!
          trap 'adb -e emu kill || true' EXIT
          until [[ "$(adb -e shell getprop sys.boot_completed 2>/dev/null | tr -d '\r')" == 1 ]]; do
            if ! kill -0 "$emulator_pid" 2>/dev/null || (( SECONDS >= 300 )); then
              tail -100 "$RUNNER_TEMP/emulator.log"
              exit 1
            fi
            sleep 2
          done
          adb -e shell wm size 540x1160
          adb -e shell wm density 240
          adb -e shell settings put system screen_off_timeout 1800000
          python3 scripts/check-android-settings.py app/build/app/outputs/flutter-apk/app-x86_64-release.apk "$RUNNER_TEMP/screens"
      - uses: actions/upload-artifact@v4
        if: always() && (github.event_name == 'workflow_dispatch' || github.ref == 'refs/heads/main')
        with:
          name: android-settings-screens
          path: ${{ runner.temp }}/screens
          if-no-files-found: warn

  check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Prefer crates.io
        uses: ./.github/actions/prefer-crates-io

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ env.RUST_VERSION }}
          components: rustfmt, clippy

      - name: Cache Cargo
        uses: Swatinem/rust-cache@v2

      - name: Install Linux GUI deps
        run: |
          sudo apt-get update
          sudo apt-get install -y clang cmake ninja-build pkg-config libgtk-3-dev libx11-dev libxi-dev libstdc++-14-dev

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.9'
          cache: true

      - name: Check Flutter desktop
        working-directory: app
        run: |
          flutter pub get --enforce-lockfile
          flutter analyze --no-pub
          flutter test --no-pub
      - name: Build Linux desktop
        if: inputs.release_version == ''
        working-directory: app
        run: flutter build linux --release --no-pub

      - name: fmt
        run: cargo fmt --all -- --check

      - name: clippy
        run: cargo clippy --locked --all-targets --all-features

      - name: test
        run: cargo test --locked --all-features

      - name: Build bilingual documentation
        run: cargo run --locked --features docs --bin astrave-docs

      - name: Build release bins
        run: cargo build --release --locked --bin astrave --bin astrave-server

      - name: Exercise encrypted tunnels and lossy UDP transports
        run: python3 scripts/check-tunnels.py target/release

  desktop:
    if: inputs.release_version == ''
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            target: windows
          - os: macos-15
            target: macos
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ env.RUST_VERSION }}
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.9'
          cache: true
      - working-directory: app
        run: |
          flutter pub get --enforce-lockfile
          flutter build ${{ matrix.target }} --release --no-pub
