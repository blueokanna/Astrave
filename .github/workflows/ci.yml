name: CI

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_call:
    inputs:
      release_version:
        type: string
        default: ''

env:
  CARGO_TERM_COLOR: always
  RUST_VERSION: "1.95.0"

jobs:
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ env.RUST_VERSION }}
          targets: aarch64-linux-android,armv7-linux-androideabi,x86_64-linux-android
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - run: sdkmanager 'ndk;28.2.13676358' 'platforms;android-36'
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.9'
          cache: true
      - name: Prepare Android release signing
        if: inputs.release_version != ''
        env:
          KEYSTORE: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.ANDROID_STORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          : "${KEYSTORE:?Missing ANDROID_KEYSTORE_BASE64}" "${STORE_PASSWORD:?Missing ANDROID_STORE_PASSWORD}" "${KEY_ALIAS:?Missing ANDROID_KEY_ALIAS}" "${KEY_PASSWORD:?Missing ANDROID_KEY_PASSWORD}"
          umask 077
          printf '%s' "$KEYSTORE" | base64 --decode > "$RUNNER_TEMP/astrave.jks"
          echo "ASTRAVE_KEYSTORE=$RUNNER_TEMP/astrave.jks" >> "$GITHUB_ENV"
      - name: Build Android APKs
        working-directory: app
        env:
          ASTRAVE_STORE_PASSWORD: ${{ secrets.ANDROID_STORE_PASSWORD }}
          ASTRAVE_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ASTRAVE_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          flutter pub get --enforce-lockfile
          ANDROID_NDK_HOME="$ANDROID_HOME/ndk/28.2.13676358" flutter build apk --release --split-per-abi --no-pub
      - name: Stage signed APKs
        if: inputs.release_version != ''
        env:
          VERSION: ${{ inputs.release_version }}
        run: |
          mkdir -p dist/android
          signer=$(find "$ANDROID_HOME/build-tools" -type f -name apksigner | sort -V | tail -1)
          for abi in arm64-v8a armeabi-v7a x86_64; do
            apk="app/build/app/outputs/flutter-apk/app-$abi-release.apk"
            "$signer" verify "$apk"
            cp "$apk" "dist/android/astrave_${VERSION}_android_$abi.apk"
          done
      - uses: actions/upload-artifact@v4
        if: inputs.release_version != ''
        with:
          name: android-apks
          path: dist/android/*.apk
          if-no-files-found: error

  check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Prefer crates.io
        uses: ./.github/actions/prefer-crates-io

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ env.RUST_VERSION }}
          components: rustfmt, clippy

      - name: Cache Cargo
        uses: Swatinem/rust-cache@v2

      - name: Install Linux GUI deps
        run: |
          sudo apt-get update
          sudo apt-get install -y clang cmake ninja-build pkg-config libgtk-3-dev libx11-dev libxi-dev libstdc++-14-dev

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.9'
          cache: true

      - name: Check Flutter desktop
        working-directory: app
        run: |
          flutter pub get --enforce-lockfile
          flutter analyze --no-pub
          flutter test --no-pub
      - name: Build Linux desktop
        if: inputs.release_version == ''
        working-directory: app
        run: flutter build linux --release --no-pub

      - name: fmt
        run: cargo fmt --all -- --check

      - name: clippy
        run: cargo clippy --locked --all-targets --all-features

      - name: test
        run: cargo test --locked --all-features

      - name: Build bilingual documentation
        run: cargo run --locked --features docs --bin astrave-docs

      - name: Build release bins
        run: cargo build --release --locked --bin astrave --bin astrave-server

  desktop:
    if: inputs.release_version == ''
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            target: windows
          - os: macos-15
            target: macos
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ env.RUST_VERSION }}
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.9'
          cache: true
      - working-directory: app
        run: |
          flutter pub get --enforce-lockfile
          flutter build ${{ matrix.target }} --release --no-pub
