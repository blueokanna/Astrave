[package]
name = "astrave"
version = "1.0.1"
edition = "2024"
rust-version = "1.95"
license = "Apache-2.0"
authors = ["blueokanna", "HyphenTeam", "lxien"]
publish = false
autobins = false

[lib]
name = "astrave_desktop"
crate-type = ["cdylib", "staticlib", "rlib"]

[[bin]]
name = "astrave"
path = "src/astrave.rs"
required-features = ["cli"]

[[bin]]
name = "astrave-server"
path = "src/server.rs"
required-features = ["cli"]

[[bin]]
name = "astrave-docs"
path = "src/docs.rs"
required-features = ["docs"]

[features]
default = ["cli"]
cli = ["runtime", "dep:clap", "dep:uuid"]
runtime = [
    "dep:async-trait",
    "dep:fast-socks5",
    "dep:hostname",
    "dep:httparse",
    "dep:jiff",
    "dep:kcp-tokio",
    "dep:quinn",
    "dep:rcgen",
    "dep:recurse-x",
    "dep:serde",
    "dep:socket2",
    "dep:thiserror",
    "dep:tls-parser",
    "dep:toml_edit",
    "dep:tzcraft",
    "dep:tracing",
    "dep:tracing-appender",
    "dep:tracing-subscriber",
    "dep:yamux",
    "dep:tokio-util",
    "dep:tokio-rustls",
    "dep:rustls",
    "dep:rustls-platform-verifier",
    "dep:tokio",
    "dep:courierust",
    "dep:anyhow",
]
http = [
    "dep:courierust",
    "dep:rustls",
    "dep:rustls-platform-verifier",
    "dep:hyper-util",
    "dep:tokio",
    "dep:anyhow",
]
app = [
    "runtime",
    "http",
    "dep:bytes",
    "dep:http",
    "dep:http-body-util",
    "dep:flutter_rust_bridge",
    "dep:instant-acme",
    "dep:jni",
    "dep:libc",
    "dep:percent-encoding",
    "dep:serde_json",
    "dep:tempfile",
    "toml_edit/display",
    "dep:uuid",
]
docs = ["http", "dep:pulldown-cmark"]

[dependencies]
nextjson = { version = "=0.1.5", default-features = false, features = [
    "derive",
] }
rustbinary = { version = "=0.1.10", default-features = false, features = [
    "derive",
    "compact",
] }
recurse-x = { version = "=0.2.6", features = ["std"], optional = true }
courierust = { version = "=1.1.3", features = ["std"], optional = true }
tzcraft = { version = "=0.1.2", default-features = false, features = [
    "std",
], optional = true }
ring = { version = "0.17", default-features = false }
anyhow = { version = "1", optional = true }
async-trait = { version = "0.1", optional = true }
base64 = { version = "0.23", default-features = false, features = ["alloc"] }
bytes = { version = "1", optional = true }
clap = { version = "4.6.9", default-features = false, features = [
    "std",
    "derive",
    "help",
    "usage",
    "error-context",
], optional = true }
fast-socks5 = { version = "1.0", optional = true }
flutter_rust_bridge = { version = "=2.13.0", optional = true }
hostname = { version = "0.4", optional = true }
http = { version = "1", optional = true }
http-body-util = { version = "0.1", optional = true }
hyper-util = { version = "0.1", features = ["client-proxy"], optional = true }
httparse = { version = "1", optional = true }
instant-acme = { version = "0.8.5", default-features = false, features = [
    "ring",
], optional = true }
jiff = { version = "1.0.1", optional = true }
kcp-tokio = { version = "0.7", optional = true }
percent-encoding = { version = "2", optional = true }
pulldown-cmark = { version = "0.13", default-features = false, features = [
    "html",
], optional = true }
quinn = { version = "0.11.12", optional = true }
rcgen = { version = "0.14", optional = true }
rustls = { version = "0.23.46", default-features = false, features = [
    "ring",
    "std",
], optional = true }
rustls-platform-verifier = { version = "0.7.1", optional = true }
serde = { version = "1", features = ["derive"], optional = true }
serde_json = { version = "1.0.154", optional = true }
socket2 = { version = "0.6.5", optional = true }
tempfile = { version = "3", optional = true }
thiserror = { version = "2.0.21", optional = true }
tls-parser = { version = "0.12", optional = true }
tokio = { version = "1", default-features = false, features = [
    "rt-multi-thread",
    "macros",
    "net",
    "io-util",
    "sync",
    "time",
    "signal",
], optional = true }
tokio-rustls = { version = "0.26.6", default-features = false, features = [
    "ring",
    "tls12",
], optional = true }
tokio-util = { version = "0.7.20", features = [
    "io",
    "compat",
    "rt",
], optional = true }
toml_edit = { version = "0.25", default-features = false, features = ["parse", "serde"], optional = true }
tracing = { version = "0.1", optional = true }
tracing-appender = { version = "0.2", optional = true }
tracing-subscriber = { version = "0.3", features = [
    "env-filter",
], optional = true }
uuid = { version = "1.29.3", features = ["v4"], optional = true }
yamux = { version = "0.14", optional = true }

[target.'cfg(unix)'.dependencies]
libc = { version = "0.2", optional = true }

[target.'cfg(target_os = "android")'.dependencies]
jni = { version = "0.22.4", optional = true }

[dev-dependencies]
tokio = { version = "1", default-features = false, features = ["test-util"] }

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(frb_expand)'] }
