name: astrave_desktop
description: Flutter client for Astrave on Android, Windows, Linux and macOS.
publish_to: none
version: 1.0.0+1

environment:
  sdk: ^3.13.0

dependencies:
  flutter:
    sdk: flutter
  dynamic_color: ^2.1.0
  material_ui: ^1.11.1
  flutter_rust_bridge: 2.13.0
  flutter_rust_bridge_hooks: 2.13.0
  jni: ^1.2.1
  jni_flutter: ^1.1.0
  path_provider: ^2.1.6
  file_selector: ^1.1.0
  android_file_picker: ^2.2.0
  tray_manager: ^0.8.3
  window_manager: ^0.6.0
  shared_preferences: ^2.5.6

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/astrave.png
    - assets/fonts/GoogleSans-OFL.txt
    - assets/fonts/HarmonyOS-Sans-License.txt
  fonts:
    - family: GoogleSans
      fonts:
        - asset: assets/fonts/GoogleSans-Variable.ttf
    - family: HarmonyOSSans
      fonts:
        - asset: assets/fonts/HarmonyOS_SansSC_Regular.ttf
          weight: 400
        - asset: assets/fonts/HarmonyOS_SansSC_Medium.ttf
          weight: 500
        - asset: assets/fonts/HarmonyOS_SansSC_Bold.ttf
          weight: 700
