[workspace]
resolver = "3"
members = ["proto", "core", "client", "server", "desktop", "docs"]

[workspace.package]
version = "1.0.0"
edition = "2024"
rust-version = "1.95"
license = "Apache-2.0"
authors = ["blueokanna", "HyphenTeam", "lxien"]

[workspace.dependencies]
astrave-proto = { path = "proto" }
astrave-core = { path = "core" }
astrave-client = { path = "client" }
nextjson = { version = "=0.1.5", default-features = false, features = [
    "derive",
] }
rustbinary = { version = "=0.1.10", default-features = false, features = [
    "derive",
    "compact",
] }
recurse-x = { version = "=0.2.6", features = ["std"] }
courierust = { version = "=1.1.3", features = ["std"] }
tzcraft = { version = "=0.1.2", default-features = false, features = ["std"] }
tokio = { version = "1", default-features = false, features = [
    "rt-multi-thread",
    "macros",
    "net",
    "io-util",
    "sync",
    "time",
    "signal",
] }
tokio-util = { version = "0.7.20", features = ["io", "compat", "rt"] }
yamux = "0.14"
serde = { version = "1", features = ["derive"] }
serde_json = "1.0.154"
toml = "1.2.1"
thiserror = "2.0.21"
anyhow = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
tracing-appender = "0.2"
clap = { version = "4.6.9", default-features = false, features = [
    "std",
    "derive",
    "help",
    "usage",
    "error-context",
] }
uuid = { version = "1.29.3", features = ["v4"] }
hmac = { version = "0.13", default-features = false }
sha2 = { version = "0.11.1", default-features = false }
hex = "0.4"
base64 = "0.23.1"
async-trait = "0.1"
quinn = "0.11.12"
rustls = { version = "0.23.46", default-features = false, features = [
    "ring",
    "std",
] }
rustls-pki-types = "1.16"
tokio-rustls = { version = "0.26.6", default-features = false, features = [
    "ring",
    "tls12",
] }
rcgen = "0.14"
socket2 = "0.6.5"
kcp-tokio = "0.7"
httparse = "1"
hostname = "0.4"
jiff = "0.2"
tls-parser = "0.12"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true
panic = "abort"

[profile.release-size]
inherits = "release"
opt-level = "z"
